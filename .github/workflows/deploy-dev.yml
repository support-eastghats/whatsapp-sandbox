name: Deploy DEV

on:
  push:
    branches: [ dev ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::306461035734:role/GitHubActionsCustomCcpRole
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./envs/dev
        run: |
          terraform init \
            -backend-config="bucket=eastghats-ccp-terraform-state-dev" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=eu-west-2"

      - name: 🔍 Debug GitHub token length
        run: |
          if [ -z "$TF_VAR_github_token" ]; then
            echo "::error ::GitHub token is missing or not passed properly!"
            exit 1
          else
            echo "✅ GitHub token is set. Length: ${#TF_VAR_github_token}"
          fi
        env:
          TF_VAR_github_token: ${{ secrets.TF_VAR_github_token }}

      - name: Terraform Apply
        working-directory: ./envs/dev
        env:
          TF_VAR_github_token: ${{ secrets.TF_VAR_github_token }}
        run: terraform apply -auto-approve
